<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineMatch — Movie Recommender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ── Tokens ────────────────────────────────────────────────── */
    :root {
      --bg:         #0d0d0f;
      --surface:    #16161a;
      --border:     #2a2a30;
      --accent:     #e8c547;       /* warm amber — film-reel gold */
      --accent-dim: #a88b2a;
      --text:       #e8e8ec;
      --muted:      #7a7a88;
      --danger:     #e05c5c;

      --font-display: 'Bebas Neue', sans-serif;
      --font-body:    'Inter', system-ui, sans-serif;

      --radius: 6px;
      --transition: 180ms ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Header ────────────────────────────────────────────────── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 28px 32px 24px;
      display: flex;
      align-items: baseline;
      gap: 14px;
    }

    header h1 {
      font-family: var(--font-display);
      font-size: 2.6rem;
      letter-spacing: 0.04em;
      color: var(--accent);
      line-height: 1;
    }

    header span {
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Status pill ───────────────────────────────────────────── */
    #status-pill {
      margin-left: auto;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 99px;
      border: 1px solid var(--border);
      color: var(--muted);
      transition: color var(--transition), border-color var(--transition);
    }
    #status-pill.online  { color: #6fcf97; border-color: #6fcf97; }
    #status-pill.offline { color: var(--danger); border-color: var(--danger); }

    /* ── Main layout ───────────────────────────────────────────── */
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* ── Search bar ────────────────────────────────────────────── */
    .search-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    .search-wrap input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 1rem;
      padding: 14px 52px 14px 16px;
      outline: none;
      transition: border-color var(--transition);
    }
    .search-wrap input::placeholder { color: var(--muted); }
    .search-wrap input:focus { border-color: var(--accent); }

    /* clear button */
    #clear-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
      display: none;
      padding: 4px;
    }
    #clear-btn:hover { color: var(--text); }

    /* ── Autocomplete dropdown ─────────────────────────────────── */
    #autocomplete {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      z-index: 100;
      display: none;
    }

    .ac-item {
      padding: 10px 16px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      transition: background var(--transition);
    }
    .ac-item:hover, .ac-item.active { background: #1e1e24; }
    .ac-item .ac-title { color: var(--text); }
    .ac-item .ac-genre {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    /* ── Controls row ──────────────────────────────────────────── */
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 40px;
      align-items: center;
    }

    #search-btn {
      background: var(--accent);
      color: #0d0d0f;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 12px 24px;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition), opacity var(--transition);
    }
    #search-btn:hover { background: #f0d060; }
    #search-btn:disabled { opacity: 0.4; cursor: default; }

    .n-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-left: auto;
      white-space: nowrap;
    }

    #n-select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.85rem;
      padding: 8px 10px;
      cursor: pointer;
      outline: none;
    }
    #n-select:focus { border-color: var(--accent); }

    /* ── Error banner ──────────────────────────────────────────── */
    #error-box {
      display: none;
      background: #1f1214;
      border: 1px solid var(--danger);
      border-radius: var(--radius);
      color: var(--danger);
      font-size: 0.88rem;
      padding: 12px 16px;
      margin-bottom: 28px;
    }

    /* ── Query label ───────────────────────────────────────────── */
    #query-label {
      display: none;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    #query-label strong { color: var(--accent); font-style: normal; }

    /* ── Results grid ──────────────────────────────────────────── */
    #results {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* ── Movie card ────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: grid;
      grid-template-columns: 2ch 1fr auto;
      gap: 0 16px;
      align-items: start;
      opacity: 0;
      transform: translateY(10px);
      animation: slide-in 220ms ease forwards;
    }

    @keyframes slide-in {
      to { opacity: 1; transform: translateY(0); }
    }

    .card:hover { border-color: #3a3a42; }

    .card-rank {
      font-family: var(--font-display);
      font-size: 1.4rem;
      color: var(--accent);
      line-height: 1.1;
      padding-top: 2px;
    }

    .card-title {
      font-size: 0.97rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 5px;
    }

    .card-genres {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .genre-tag {
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      background: #1e1e24;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 2px 7px;
    }

    /* ── Similarity bar ────────────────────────────────────────── */
    .card-score {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      min-width: 56px;
    }

    .score-num {
      font-size: 0.78rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .score-bar-bg {
      width: 48px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 400ms ease;
    }

    /* ── Skeleton loader ───────────────────────────────────────── */
    .skeleton {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .skel-block {
      background: linear-gradient(90deg, #1e1e24 25%, #242430 50%, #1e1e24 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 3px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Empty state ───────────────────────────────────────────── */
    #empty {
      display: none;
      text-align: center;
      padding: 64px 0;
      color: var(--muted);
    }

    #empty .empty-icon {
      font-size: 2.4rem;
      margin-bottom: 12px;
    }

    #empty p { font-size: 0.9rem; }

    /* ── Footer ────────────────────────────────────────────────── */
    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 10px 32px;
      font-size: 0.72rem;
      color: var(--muted);
      display: flex;
      gap: 20px;
    }
    footer code {
      font-family: 'Courier New', monospace;
      color: var(--accent-dim);
    }

    /* ── Responsive ────────────────────────────────────────────── */
    @media (max-width: 520px) {
      header { padding: 20px 16px 16px; }
      header h1 { font-size: 2rem; }
      main { padding: 32px 16px 72px; }
      .card { grid-template-columns: 2ch 1fr; }
      .card-score { display: none; }
      footer { padding: 10px 16px; }
    }

    /* ── Reduced motion ────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; opacity: 1; transform: none; }
      .skel-block { animation: none; }
    }
  </style>
</head>

<body>

  <header>
    <h1>CineMatch</h1>
    <span>Content-based movie recommender</span>
    <div id="status-pill">checking…</div>
  </header>

  <main>
    <div class="search-wrap">
      <input
        id="title-input"
        type="text"
        placeholder="Type a movie title, e.g. Pulp Fiction…"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="clear-btn" title="Clear">✕</button>
      <div id="autocomplete"></div>
    </div>

    <div class="controls">
      <button id="search-btn" disabled>Find similar</button>
      <label class="n-label" for="n-select">Results</label>
      <select id="n-select">
        <option value="5" selected>5</option>
        <option value="8">8</option>
        <option value="10">10</option>
      </select>
    </div>

    <div id="error-box"></div>
    <div id="query-label"></div>
    <div id="results"></div>
    <div id="empty">
      <div class="empty-icon">🎬</div>
      <p>No matches found. Try a different title.</p>
    </div>
  </main>

  <footer>
    <span>API → <code>localhost:5000</code></span>
    <span>Dataset: MovieLens · TF-IDF + cosine similarity</span>
  </footer>

  <script>
    const API = 'http://localhost:5000';

    // ── DOM refs ──────────────────────────────────────────────────
    const input      = document.getElementById('title-input');
    const clearBtn   = document.getElementById('clear-btn');
    const searchBtn  = document.getElementById('search-btn');
    const nSelect    = document.getElementById('n-select');
    const acBox      = document.getElementById('autocomplete');
    const errorBox   = document.getElementById('error-box');
    const queryLabel = document.getElementById('query-label');
    const results    = document.getElementById('results');
    const empty      = document.getElementById('empty');
    const pill       = document.getElementById('status-pill');

    // ── State ─────────────────────────────────────────────────────
    let acIndex = -1;
    let acItems = [];
    let debounceTimer;

    // ── Health check on load ──────────────────────────────────────
    async function checkHealth() {
      try {
        const res = await fetch(`${API}/health`);
        const data = await res.json();
        pill.textContent = `${data.movies_loaded} movies`;
        pill.className = 'online';
      } catch {
        pill.textContent = 'API offline';
        pill.className = 'offline';
        showError('Cannot reach the Flask API. Make sure it\'s running: python api.py');
      }
    }
    checkHealth();

    // ── Helpers ───────────────────────────────────────────────────
    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }
    function clearError() { errorBox.style.display = 'none'; }

    function showSkeletons(n) {
      results.innerHTML = Array.from({ length: n }, () => `
        <div class="skeleton">
          <div class="skel-block" style="width:20px;height:22px;flex-shrink:0"></div>
          <div style="flex:1;display:flex;flex-direction:column;gap:8px">
            <div class="skel-block" style="height:14px;width:65%"></div>
            <div class="skel-block" style="height:10px;width:45%"></div>
          </div>
        </div>
      `).join('');
      empty.style.display = 'none';
      queryLabel.style.display = 'none';
    }

    function renderResults(data) {
      const recs = data.recommendations;
      queryLabel.innerHTML = `Showing <strong>${recs.length}</strong> picks similar to <strong>"${data.query}"</strong>`;
      queryLabel.style.display = 'block';

      if (!recs.length) {
        results.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      // Find max score for bar scaling
      const maxScore = Math.max(...recs.map(r => r.similarity_score));

      results.innerHTML = recs.map((r, i) => {
        const genres = r.genres.split('|').map(g =>
          `<span class="genre-tag">${g}</span>`
        ).join('');
        const pct = maxScore > 0 ? Math.round((r.similarity_score / maxScore) * 100) : 0;
        const delay = i * 40;

        return `
          <div class="card" style="animation-delay:${delay}ms">
            <div class="card-rank">${i + 1}</div>
            <div>
              <div class="card-title">${r.title}</div>
              <div class="card-genres">${genres}</div>
            </div>
            <div class="card-score">
              <div class="score-num">${r.similarity_score.toFixed(2)}</div>
              <div class="score-bar-bg">
                <div class="score-bar-fill" style="width:${pct}%"></div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // ── Main search ───────────────────────────────────────────────
    async function doSearch() {
      const title = input.value.trim();
      if (!title) return;

      closeAutocomplete();
      clearError();
      showSkeletons(parseInt(nSelect.value));
      searchBtn.disabled = true;

      try {
        const n = nSelect.value;
        const res = await fetch(`${API}/recommend?title=${encodeURIComponent(title)}&n=${n}`);
        const data = await res.json();

        if (!res.ok) {
          results.innerHTML = '';
          showError(data.error || 'Something went wrong.');
          queryLabel.style.display = 'none';
        } else {
          renderResults(data);
        }
      } catch {
        results.innerHTML = '';
        showError('Request failed. Is the API running on localhost:5000?');
        queryLabel.style.display = 'none';
      } finally {
        searchBtn.disabled = false;
      }
    }

    // ── Autocomplete ──────────────────────────────────────────────
    async function fetchSuggestions(q) {
      if (q.length < 2) { closeAutocomplete(); return; }
      try {
        const res = await fetch(`${API}/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        acItems = (data.results || []).slice(0, 6);
        renderAutocomplete();
      } catch { closeAutocomplete(); }
    }

    function renderAutocomplete() {
      if (!acItems.length) { closeAutocomplete(); return; }
      acBox.style.display = 'block';
      acIndex = -1;
      acBox.innerHTML = acItems.map((m, i) => `
        <div class="ac-item" data-idx="${i}">
          <span class="ac-title">${m.title}</span>
          <span class="ac-genre">${m.genres.replace(/\|/g, ' · ')}</span>
        </div>
      `).join('');

      acBox.querySelectorAll('.ac-item').forEach(el => {
        el.addEventListener('mousedown', e => {
          e.preventDefault();
          const idx = parseInt(el.dataset.idx);
          selectSuggestion(idx);
        });
      });
    }

    function closeAutocomplete() {
      acBox.style.display = 'none';
      acItems = [];
      acIndex = -1;
    }

    function selectSuggestion(idx) {
      input.value = acItems[idx].title;
      clearBtn.style.display = 'block';
      searchBtn.disabled = false;
      closeAutocomplete();
      doSearch();
    }

    function highlightAcItem(newIdx) {
      const items = acBox.querySelectorAll('.ac-item');
      items.forEach((el, i) => el.classList.toggle('active', i === newIdx));
      acIndex = newIdx;
    }

    // ── Event listeners ───────────────────────────────────────────
    input.addEventListener('input', () => {
      const val = input.value.trim();
      clearBtn.style.display = val ? 'block' : 'none';
      searchBtn.disabled = !val;

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => fetchSuggestions(val), 200);
    });

    input.addEventListener('keydown', e => {
      if (acBox.style.display !== 'none' && acItems.length) {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          highlightAcItem(Math.min(acIndex + 1, acItems.length - 1));
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          highlightAcItem(Math.max(acIndex - 1, -1));
        } else if (e.key === 'Enter') {
          if (acIndex >= 0) { e.preventDefault(); selectSuggestion(acIndex); return; }
        } else if (e.key === 'Escape') {
          closeAutocomplete(); return;
        }
      }
      if (e.key === 'Enter') doSearch();
    });

    input.addEventListener('blur', () => {
      setTimeout(closeAutocomplete, 150);
    });

    clearBtn.addEventListener('click', () => {
      input.value = '';
      clearBtn.style.display = 'none';
      searchBtn.disabled = true;
      results.innerHTML = '';
      queryLabel.style.display = 'none';
      empty.style.display = 'none';
      clearError();
      input.focus();
    });

    searchBtn.addEventListener('click', doSearch);
  </script>
</body>
</html>
